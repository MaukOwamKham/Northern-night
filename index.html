<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Dream Horizon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* body {
            background: #010614;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center; */
        body {
            /* ပုံကို background အဖြစ် ထည့်သွင်းခြင်း */
            background: url('images/northen.jpg') no-repeat center center fixed;
            background-size: cover;
            /* ပုံကို screen အပြည့်ဖြစ်အောင် လုပ်ပေးတာပါ */
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            /* စာသားနောက်မှာ အရိပ်ပါးပါးလေး ထည့်လိုက်ရင် ပိုဖတ်ရကောင်းပါတယ် */
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.8);
        }

        /* --- Realistic Northern Lights Background --- */
        /* .aurora-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #010b1a;
            overflow: hidden;
            z-index: 1;
        } */

        /* .aurora {
            position: absolute;
            width: 200%;
            height: 100%;
            top: -20%;
            left: -50%;
            background: radial-gradient(ellipse at center,
                    rgba(0, 255, 150, 0.2) 0%,
                    rgba(0, 200, 255, 0.15) 30%,
                    rgba(100, 0, 255, 0.1) 60%,
                    transparent 80%);
            filter: blur(60px);
            animation: aurora-move 15s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        } */

        .aurora-secondary {
            position: absolute;
            width: 180%;
            height: 120%;
            top: -10%;
            left: -40%;
            background: radial-gradient(ellipse at center,
                    rgba(0, 255, 100, 0.15) 0%,
                    rgba(0, 100, 255, 0.1) 40%,
                    transparent 70%);
            filter: blur(80px);
            animation: aurora-move 20s ease-in-out infinite alternate-reverse;
            opacity: 0.8;
        }

        @keyframes aurora-move {
            0% {
                transform: rotate(0deg) translateY(0);
            }

            100% {
                transform: rotate(5deg) translateY(5%);
            }
        }

        /* --- Stars Background --- */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(1px 1px at 20% 30%, white, transparent),
                radial-gradient(1.5px 1.5px at 50% 70%, white, transparent),
                radial-gradient(1px 1px at 80% 40%, white, transparent),
                radial-gradient(1.2px 1.2px at 30% 90%, white, transparent);
            background-size: 250px 250px;
            opacity: 0.4;
            z-index: 2;
        }

        /* --- Content Area --- */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #4fffb0, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(79, 255, 176, 0.4);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* --- Stylish Button --- */
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(79, 255, 176, 0.6);
            color: white;
            padding: 16px 45px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.4s;
        }

        .btn:hover {
            background: rgba(79, 255, 176, 0.2);
            box-shadow: 0 0 25px rgba(79, 255, 176, 0.4);
            transform: translateY(-3px);
        }

        .btn.active {
            background: #ff4b72;
            border-color: #ff4b72;
            box-shadow: 0 0 30px rgba(255, 75, 114, 0.6);
        }

        /* --- I Miss You Messages (Full Sky) --- */
        .miss-you {
            position: fixed;
            color: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            animation: sky-float 4s ease-out forwards;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes sky-float {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1.1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="aurora-container" id="sky">
        <div class="stars"></div>
        <div class="aurora"></div>
        <div class="aurora-secondary"></div>
    </div>

    <div class="content">
        <h1>Our Dream Horizon</h1>
        <p>"Imagine us sitting under the Northern Lights, just watching the sky. Will you be the one sharing that moment with me?"</p>
        <button class="btn" id="promiseBtn">♥ Count me in</button>
    </div>

    <script>
        const btn = document.getElementById('promiseBtn');
        const sky = document.getElementById('sky');

        btn.addEventListener('click', () => {
            btn.classList.add('active');
            btn.innerText = "♥ It's a promise";

            // စာသား ၆၀ ကျော်ကို screen အနှံ့ ပျံ့စေမယ်
            for (let i = 0; i < 65; i++) {
                setTimeout(() => {
                    const msg = document.createElement('div');
                    msg.className = 'miss-you';
                    msg.innerText = 'I miss you <3';

                    // Screen တစ်ခုလုံးရဲ့ random နေရာတွေမှာ ပေါ်လာမယ်
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;

                    // Font size တွေကိုလည်း random လုပ်မယ် (ပိုလှအောင်)
                    const size = Math.random() * (2 - 0.8) + 0.8;
                    msg.style.fontSize = size + 'rem';

                    msg.style.left = x + 'px';
                    msg.style.top = y + 'px';

                    document.body.appendChild(msg);

                    // Animation ပြီးရင် ဖျက်မယ်
                    setTimeout(() => {
                        msg.remove();
                    }, 4000);
                }, i * 60); // တစ်ခုနဲ့တစ်ခု ပေါ်လာတဲ့အချိန် မတူအောင်
            }
        });
    </script>
</body>

</html>
